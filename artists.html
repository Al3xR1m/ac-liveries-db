<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artists — AC Liveries DB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo__ac">AC</span>
    <span class="nav-logo__name">&nbsp;Liveries</span>
    <span class="nav-logo__db">DB</span>
  </a>
  <div class="nav-divider"></div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Liveries</a>
    <a href="mods.html" class="nav-link">Mods</a>
    <a href="artists.html" class="nav-link active" aria-current="page">Artists</a>
    <a href="addons.html" class="nav-link">Addons</a>
    <a href="about.html" class="nav-link">About</a>
  </div>
  <div class="nav-end">
    <button class="btn btn--icon btn--ghost" id="themeToggle" aria-label="Toggle theme">
      <i class="ti ti-sun" id="themeIcon"></i>
    </button>
    <a href="submit.html" class="btn btn--primary">
      <i class="ti ti-plus"></i> Submit
    </a>
  </div>
</nav>

<div class="page" style="padding-top:40px; padding-bottom:60px;">

  <!-- Header -->
  <div style="margin-bottom:32px;">
    <div class="hero__eyebrow" style="display:inline-flex;">
      <i class="ti ti-crown"></i> Confirmed Artists
    </div>
    <h1 class="display-md" style="margin-top:12px;">
      The <span style="color:var(--acc);">artists</span>
    </h1>
    <p style="font-size:13px; color:var(--text-2); margin-top:8px;">
      Verified livery creators — click an artist to browse all their work
    </p>
  </div>

  <!-- Artist grid -->
  <div id="artists-grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-bottom:40px;">
    <div class="skeleton" style="height:200px;"></div>
    <div class="skeleton" style="height:200px;"></div>
    <div class="skeleton" style="height:200px;"></div>
    <div class="skeleton" style="height:200px;"></div>
  </div>

  <!-- Artist liveries section (shown after clicking an artist) -->
  <div id="artist-liveries-section" style="display:none; margin-bottom:40px;">

    <!-- Back + title -->
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px; padding-top:24px; border-top:1px solid var(--border);">
      <button
        id="back-btn"
        class="btn btn--ghost btn--sm"
        style="display:flex; align-items:center; gap:6px;"
      >
        <i class="ti ti-arrow-left"></i> All artists
      </button>
      <h2 class="display-sm" id="artist-liveries-title"></h2>
    </div>

    <!-- Artist profile card -->
    <div
      id="artist-profile-card"
      style="display:none; background:var(--bg-s1); border:1px solid rgba(245,158,11,0.2); border-radius:var(--radius-lg); padding:20px; margin-bottom:20px; gap:16px; align-items:flex-start;"
    ></div>

    <!-- Filters -->
    <div class="toolbar" style="margin-bottom:14px;">
      <div class="search-box" style="flex:1; min-width:160px;">
        <i class="ti ti-search search-box__icon"></i>
        <input type="text" class="form-input" id="artist-search" placeholder="Search livery, driver, team…" style="padding-left:33px;">
      </div>
      <select class="filter-select" id="artist-cat"><option value="all">All categories</option></select>
      <select class="filter-select" id="artist-champ"><option value="all">All championships</option></select>
      <select class="filter-select" id="artist-mod"><option value="all">All mods</option></select>
      <select class="filter-select" id="artist-pricing">
        <option value="all">All pricing</option>
        <option value="free">Free only</option>
        <option value="paid">Paid only</option>
      </select>
      <select class="filter-select" id="artist-sort">
        <option value="votes">↑ Most popular</option>
        <option value="newest">Newest first</option>
        <option value="name">A → Z</option>
      </select>
    </div>

    <div id="results-count-artist" class="label" style="margin-bottom:12px;"></div>

    <div class="livery-grid" id="artist-liveries-grid"></div>
  </div>

</div>

<script src="supabase.js"></script>
<script>
  // Theme
  const root = document.documentElement;
  const saved = localStorage.getItem('acliveries_theme') || 'dark';
  root.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next); localStorage.setItem('acliveries_theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  });

  // Car SVG placeholder
  const CAT_COLORS = { Formula:['#E82020','#003087','#006400','#FF8000'], GT:['#C8A800','#E82020','#003087'], Hillclimb:['#E87000','#E82020'], Touring:['#534AB7','#E82020'] };
  const CAT_BG = { Formula:'#0d0d1f', GT:'#0d1a0d', Hillclimb:'#1a0d00', Touring:'#1a001a' };
  function carSVG(cat, seed) {
    const palette = CAT_COLORS[cat] || CAT_COLORS.Formula;
    const col = palette[seed % palette.length];
    const num = (seed * 7 + 1) % 99 + 1;
    const bg = CAT_BG[cat] || '#111';
    return `<svg viewBox="0 0 200 100" width="200" height="100"><rect width="200" height="100" fill="${bg}"/><ellipse cx="100" cy="68" rx="65" ry="10" fill="#000" opacity=".4"/><path d="M36 62 Q45 46 60 42 L76 36 Q100 30 124 36 L140 42 Q155 46 164 62Z" fill="${col}"/><path d="M60 42 L64 32 Q100 24 136 32 L140 42Z" fill="${col}" opacity=".75"/><rect x="76" y="30" width="48" height="9" rx="2" fill="#88ccff" opacity=".5"/><circle cx="60" cy="64" r="10" fill="#1a1a1a"/><circle cx="60" cy="64" r="5.5" fill="#333"/><circle cx="140" cy="64" r="10" fill="#1a1a1a"/><circle cx="140" cy="64" r="5.5" fill="#333"/><text x="100" y="54" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif" font-weight="bold">${num}</text></svg>`;
  }

  let voted = getVotedSet();
  let allLiveries = [];

  async function init() {
    const [artists, stats] = await Promise.all([fetchArtists(), fetchArtistStats()]);
    const grid = document.getElementById('artists-grid');

    if (!artists.length) {
      grid.innerHTML = `<div style="grid-column:1/-1; padding:48px 24px; text-align:center; color:var(--text-2);"><i class="ti ti-user-off" style="font-size:32px; display:block; margin-bottom:12px; color:var(--text-3);"></i><p>No confirmed artists yet.</p></div>`;
      return;
    }

    grid.innerHTML = artists.map(a => {
      const s = stats[a.id] || { count: 0, upvotes: 0 };
      const initials = a.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      const avatar = a.avatar_url
        ? `<img src="${a.avatar_url}" alt="${a.name}" style="width:52px;height:52px;border-radius:13px;object-fit:cover;border:2px solid rgba(245,158,11,0.3);">`
        : `<div class="artist-avatar artist-avatar--md" style="background:var(--acc-2); color:var(--acc);">${initials}</div>`;
      return `
        <div class="artist-card artist-card--confirmed" data-artist-id="${a.id}" data-artist-name="${a.name}" style="cursor:pointer;">
          <div class="artist-card__glow"></div>
          ${avatar}
          <div style="margin-top:12px;">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
              <span style="font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.3px;">${a.name}</span>
              <span style="font-size:13px;">👑</span>
            </div>
            ${a.discord ? `<div style="font-size:11px;color:var(--text-2);margin-bottom:10px;">${a.discord}</div>` : '<div style="margin-bottom:10px;"></div>'}
            <div style="display:flex;gap:14px;">
              <div>
                <div style="font-size:16px;font-weight:800;letter-spacing:-0.8px;color:var(--text);">${s.count}</div>
                <div class="label" style="margin-top:2px;">Liveries</div>
              </div>
              <div>
                <div style="font-size:16px;font-weight:800;letter-spacing:-0.8px;color:var(--text);">${s.upvotes}</div>
                <div class="label" style="margin-top:2px;">Votes</div>
              </div>
            </div>
          </div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.artist-card').forEach(card => {
      card.addEventListener('click', () => showArtistLiveries(card.dataset.artistId, card.dataset.artistName));
    });
  }

  async function showArtistLiveries(artistId, artistName) {
    document.getElementById('artists-grid').style.display = 'none';
    const section = document.getElementById('artist-liveries-section');
    section.style.display = 'block';
    document.getElementById('artist-liveries-title').textContent = `${artistName}'s liveries`;

    const artistData = (await fetchArtists()).find(a=>a.id===artistId);
    const profileEl = document.getElementById('artist-profile-card');
    if(artistData && profileEl){
      profileEl.style.display = 'flex';
      const initials = artistData.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
      profileEl.innerHTML = `
        <div style="flex-shrink:0;">
          ${artistData.avatar_url
            ? `<img src="${artistData.avatar_url}" alt="${artistData.name}" style="width:72px;height:72px;border-radius:18px;object-fit:cover;border:2px solid rgba(245,158,11,0.3);">`
            : `<div class="artist-avatar" style="width:72px;height:72px;border-radius:18px;background:var(--acc-2);color:var(--acc);font-size:22px;">${initials}</div>`}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
            <span style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.8px;">${artistData.name}</span>
            <span class="badge badge--confirmed">👑 Confirmed Artist</span>
          </div>
          ${artistData.discord ? `<div style="font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px;margin-bottom:8px;"><i class="ti ti-brand-discord" style="font-size:13px;color:#5865F2;"></i>${artistData.discord}</div>` : ''}
          ${artistData.bio ? `<div style="font-size:13px;color:var(--text-2);line-height:1.6;margin-bottom:10px;">${artistData.bio}</div>` : ''}
          ${(()=>{
            const btns = [
              {url: artistData.url_twitter,  icon:'ti-brand-twitter',  label:'Twitter'},
              {url: artistData.url_discord,  icon:'ti-brand-discord',  label:'Discord'},
              {url: artistData.url_patreon,  icon:'ti-brand-patreon',  label:'Patreon'},
              {url: artistData.url_youtube,  icon:'ti-brand-youtube',  label:'YouTube'},
              {url: artistData.url_overtake, icon:'ti-flag',           label:'Overtake'},
            ].filter(b=>b.url);
            if(!btns.length) return '';
            return '<div style="display:flex;gap:6px;flex-wrap:wrap;">'
              + btns.map(b=>`<a href="${b.url}" target="_blank" class="social-btn"><i class="ti ${b.icon}"></i>${b.label}</a>`).join('')
              + '</div>';
          })()}
        </div>`;
    }

    const liveries = await fetchLiveries({ artistId, sort: 'votes' });
    allLiveries = liveries;

    ['artist-search','artist-cat','artist-champ','artist-mod','artist-pricing'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.value = el.tagName==='INPUT' ? '' : 'all';
    });
    document.getElementById('artist-sort').value = 'votes';

    const g = document.getElementById('artist-liveries-grid');
    if (!liveries.length) {
      g.innerHTML = `<div style="grid-column:1/-1;padding:48px;text-align:center;color:var(--text-2);"><i class="ti ti-photo-off" style="font-size:32px;display:block;margin-bottom:12px;color:var(--text-3);"></i><p>No liveries yet.</p></div>`;
      return;
    }

    const cats   = [...new Map(liveries.filter(l=>l.categories).map(l=>[l.category_id,l.categories])).entries()].map(([id,cat])=>({id,...cat}));
    const champs = [...new Map(liveries.filter(l=>l.championships).map(l=>[l.championship_id,l.championships])).entries()].map(([id,ch])=>({id,...ch}));
    const mods   = [...new Map(liveries.filter(l=>l.mods).map(l=>[l.mod_id,l.mods])).entries()].map(([id,m])=>({id,...m}));

    document.getElementById('artist-cat').innerHTML   = '<option value="all">All categories</option>'   + cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    document.getElementById('artist-champ').innerHTML = '<option value="all">All championships</option>' + champs.map(c=>`<option value="${c.id}">${c.short_name||c.name}</option>`).join('');
    document.getElementById('artist-mod').innerHTML   = '<option value="all">All mods</option>'         + mods.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');

    renderArtistLiveries(liveries);

    function updateArtistCascade(liveries) {
      const cat = document.getElementById('artist-cat').value;
      const afterCat = cat==='all' ? liveries : liveries.filter(l=>l.category_id===cat);
      const availChamps = [...new Map(afterCat.filter(l=>l.championships).map(l=>[l.championship_id,l.championships])).entries()].map(([id,ch])=>({id,...ch}));
      const prevChamp = document.getElementById('artist-champ').value;
      document.getElementById('artist-champ').innerHTML = '<option value="all">All championships</option>' + availChamps.map(ch=>`<option value="${ch.id}">${ch.short_name||ch.name}</option>`).join('');
      if(availChamps.some(ch=>ch.id===prevChamp)) document.getElementById('artist-champ').value=prevChamp;
      const effectiveChamp = document.getElementById('artist-champ').value;
      const afterChamp = effectiveChamp==='all' ? afterCat : afterCat.filter(l=>l.championship_id===effectiveChamp);
      const availMods = [...new Map(afterChamp.filter(l=>l.mods).map(l=>[l.mod_id,l.mods])).entries()].map(([id,m])=>({id,...m}));
      const prevMod = document.getElementById('artist-mod').value;
      document.getElementById('artist-mod').innerHTML = '<option value="all">All mods</option>' + availMods.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
      if(availMods.some(m=>m.id===prevMod)) document.getElementById('artist-mod').value=prevMod;
    }

    document.getElementById('artist-cat').addEventListener('change', ()=>{ updateArtistCascade(liveries); renderArtistLiveries(liveries); });
    document.getElementById('artist-champ').addEventListener('change', ()=>{ updateArtistCascade(liveries); renderArtistLiveries(liveries); });
    document.getElementById('artist-mod').addEventListener('change', ()=>renderArtistLiveries(liveries));
    document.getElementById('artist-search').addEventListener('input', ()=>renderArtistLiveries(liveries));
    document.getElementById('artist-pricing').addEventListener('change', ()=>renderArtistLiveries(liveries));
    document.getElementById('artist-sort').addEventListener('change', ()=>renderArtistLiveries(liveries));
  }

  function renderArtistLiveries(liveries) {
    const q       = document.getElementById('artist-search').value.toLowerCase();
    const pricing = document.getElementById('artist-pricing').value;
    const sort    = document.getElementById('artist-sort').value;
    const cat     = document.getElementById('artist-cat').value;
    const champ   = document.getElementById('artist-champ').value;
    const mod     = document.getElementById('artist-mod').value;

    let list = liveries.filter(l => {
      const mq  = !q || [l.name,l.team,l.author,l.driver,l.car_number].join(' ').toLowerCase().includes(q);
      const pq  = pricing==='all'||(pricing==='free'&&!l.is_paid)||(pricing==='paid'&&l.is_paid);
      const cq  = cat==='all' || l.category_id===cat;
      const chq = champ==='all' || l.championship_id===champ;
      const moq = mod==='all' || l.mod_id===mod;
      return mq && pq && cq && chq && moq;
    });
    if(sort==='votes') list.sort((a,b)=>b.upvotes-a.upvotes);
    else if(sort==='newest') list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    else list.sort((a,b)=>a.name.localeCompare(b.name));

    document.getElementById('results-count-artist').textContent = list.length ? `${list.length} liveri${list.length!==1?'es':'y'}` : '';

    const g = document.getElementById('artist-liveries-grid');
    if(!list.length){ g.innerHTML=`<div style="grid-column:1/-1;padding:48px;text-align:center;color:var(--text-2);"><i class="ti ti-search" style="font-size:32px;display:block;margin-bottom:12px;color:var(--text-3);"></i><p>No liveries match your filters.</p></div>`; return; }

    const seed = l => parseInt((l.id||'').replace(/\D/g,'').slice(0,6))||0;
    g.innerHTML = list.map(l => {
      const cn = l.categories?.name||'';
      const isNew = l.created_at && (Date.now()-new Date(l.created_at).getTime()) < 7*24*60*60*1000;
      const newBadge = isNew ? '<span class="badge badge--new">New</span>' : '';
      const priceBadge = l.is_paid ? '<span class="badge badge--paid">Paid</span>' : '<span class="badge badge--free">Free</span>';
      return `
        <div class="livery-card" onclick="location.href='livery.html?id=${l.id}'">
          <div class="livery-card__thumb">
            ${l.image_url?`<img src="${l.image_url}" alt="${l.name}" loading="lazy">`:carSVG(cn,seed(l))}
            <div class="livery-card__thumb-overlay"></div>
            <div class="livery-card__badges">${newBadge}${priceBadge}</div>
            <div class="livery-card__crown">👑</div>
            <div class="livery-card__votes"><i class="ti ti-heart" style="font-size:11px;"></i>${l.upvotes.toLocaleString()}</div>
          </div>
          <div class="livery-card__body">
            <div class="livery-card__series">${l.championships?.short_name || cn || '—'}</div>
            <div class="livery-card__name">${l.name}</div>
            <div class="livery-card__mod" style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
              <span style="color:var(--text-2);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.mods?.name||'—'}</span>
              <button class="btn btn--sm ${voted.has(l.id)?'btn--primary':'btn--ghost'} upvote-btn${voted.has(l.id)?' voted':''}"
                onclick="event.stopPropagation();handleVote('${l.id}',this)"
                style="height:22px;padding:0 7px;border-radius:5px;font-size:11px;gap:3px;flex-shrink:0;margin-left:6px;">
                <i class="ti ti-thumb-up" style="font-size:11px;"></i>
                <span>${l.upvotes}</span>
              </button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  async function handleVote(id, btn) {
    const isVoted = voted.has(id);
    const liv = allLiveries.find(l => l.id === id);
    if (isVoted) {
      const ok = await removeUpvoteLivery(id);
      if (ok && liv) { liv.upvotes = Math.max(0, liv.upvotes-1); voted = getVotedSet(); renderArtistLiveries(allLiveries); }
    } else {
      const ok = await upvoteLivery(id);
      if (ok && liv) { liv.upvotes++; voted = getVotedSet(); renderArtistLiveries(allLiveries); }
    }
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('artist-liveries-section').style.display = 'none';
    document.getElementById('artists-grid').style.display = 'grid';
    const profileEl = document.getElementById('artist-profile-card');
    if(profileEl){ profileEl.style.display='none'; profileEl.innerHTML=''; }
  });

  init();

  const urlParams = new URLSearchParams(location.search);
  const artistIdParam = urlParams.get('id');
  if(artistIdParam){
    const waitAndOpen = setInterval(()=>{
      const card = document.querySelector(`.artist-card[data-artist-id="${artistIdParam}"]`);
      if(card){ clearInterval(waitAndOpen); card.click(); }
    }, 100);
    setTimeout(()=>clearInterval(waitAndOpen), 3000);
  }
</script>
</body>
</html>
