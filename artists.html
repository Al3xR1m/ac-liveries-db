<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmed Artists — AC Liveries DB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <span class="logo-icon"><i class="ti ti-flag-3"></i></span>
    <span class="logo-text">AC Liveries<span class="logo-dot">.</span>DB</span>
  </a>
  <div class="nav-links">
    <a href="index.html">Gallery</a>
    <a href="mods.html">Mods</a>
    <a href="artists.html" class="active">Artists</a>
    <a href="submit.html">Submit</a>
    <a href="about.html">About</a>
  </div>
  <div class="nav-divider"></div>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle"><i class="ti ti-sun" id="themeIcon"></i></button>
    <a href="submit.html" class="nav-submit"><i class="ti ti-plus" style="font-size:13px"></i> Submit a livery</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">👑 Confirmed Artists</h1>
    <p class="page-sub">Verified livery creators — click an artist to browse all their work</p>
  </div>

  <!-- Artist grid -->
  <div class="artists-grid" id="artists-grid">
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
  </div>

  <!-- Liveries section (shown after clicking an artist) -->
  <div id="artist-liveries-section" style="display:none;margin-bottom:40px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-top:24px;border-top:1px solid var(--border)">
      <button id="back-btn" style="font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0">
        <i class="ti ti-arrow-left" style="font-size:15px"></i> All artists
      </button>
      <div id="artist-liveries-title" style="font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--text)"></div>
    </div>
    <!-- Toolbar -->
    <div class="toolbar" style="margin-bottom:16px">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" class="search-input" id="artist-search" placeholder="Search livery, driver, team…">
      </div>
      <select class="sort-select" id="artist-cat">
        <option value="all">All categories</option>
      </select>
      <select class="sort-select" id="artist-champ">
        <option value="all">All championships</option>
      </select>
      <select class="sort-select" id="artist-mod">
        <option value="all">All mods</option>
      </select>
      <select class="sort-select" id="artist-pricing">
        <option value="all">All pricing</option>
        <option value="free">Free only</option>
        <option value="paid">Paid only</option>
      </select>
      <select class="sort-select" id="artist-sort">
        <option value="votes">Most popular</option>
        <option value="newest">Newest first</option>
        <option value="name">A → Z</option>
      </select>
    </div>
    <div id="results-count-artist" style="font-size:12px;color:var(--text3);margin-bottom:10px"></div>
    <div class="gallery" id="artist-liveries-grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,220px))"></div>
  </div>
</div>

<script src="supabase.js"></script>
<script>
  // Theme
  const root = document.documentElement;
  const saved = localStorage.getItem('acliveries_theme') || 'dark';
  root.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next); localStorage.setItem('acliveries_theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  });

  // Car SVG placeholder
  const CAT_COLORS = { Formula:['#E82020','#003087','#006400','#FF8000'], GT:['#C8A800','#E82020','#003087'], Hillclimb:['#E87000','#E82020'], Touring:['#534AB7','#E82020'] };
  const CAT_BG = { Formula:'#0d0d1f', GT:'#0d1a0d', Hillclimb:'#1a0d00', Touring:'#1a001a' };
  function carSVG(cat, seed) {
    const palette = CAT_COLORS[cat] || CAT_COLORS.Formula;
    const col = palette[seed % palette.length];
    const num = (seed * 7 + 1) % 99 + 1;
    const bg = CAT_BG[cat] || '#111';
    return `<svg viewBox="0 0 200 100" width="200" height="100"><rect width="200" height="100" fill="${bg}"/><ellipse cx="100" cy="68" rx="65" ry="10" fill="#000" opacity=".4"/><path d="M36 62 Q45 46 60 42 L76 36 Q100 30 124 36 L140 42 Q155 46 164 62Z" fill="${col}"/><path d="M60 42 L64 32 Q100 24 136 32 L140 42Z" fill="${col}" opacity=".75"/><rect x="76" y="30" width="48" height="9" rx="2" fill="#88ccff" opacity=".5"/><circle cx="60" cy="64" r="10" fill="#1a1a1a"/><circle cx="60" cy="64" r="5.5" fill="#333"/><circle cx="140" cy="64" r="10" fill="#1a1a1a"/><circle cx="140" cy="64" r="5.5" fill="#333"/><text x="100" y="54" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif" font-weight="bold">${num}</text></svg>`;
  }
  let voted = getVotedSet();
  let allLiveries = [];
  let maxVotes = 1;

  async function init() {
    const [artists, stats] = await Promise.all([fetchArtists(), fetchArtistStats()]);
    const grid = document.getElementById('artists-grid');

    if (!artists.length) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><i class="ti ti-user-off"></i><p>No confirmed artists yet.</p></div>`;
      return;
    }

    grid.innerHTML = artists.map(a => {
      const s = stats[a.id] || { count: 0, upvotes: 0 };
      const avatar = a.avatar_url
        ? `<img src="${a.avatar_url}" alt="${a.name}" class="artist-avatar">`
        : `<div class="artist-avatar-placeholder"><i class="ti ti-user"></i></div>`;
      return `
        <div class="artist-card" data-artist-id="${a.id}" data-artist-name="${a.name}">
          ${avatar}
          <div class="artist-badge">👑 Confirmed Artist</div>
          <div class="artist-name">${a.name}</div>
          <div class="artist-stats">
            <div class="artist-stat">
              <div class="artist-stat-n">${s.count}</div>
              <div class="artist-stat-l">Liveries</div>
            </div>
            <div class="artist-stat">
              <div class="artist-stat-n">${s.upvotes}</div>
              <div class="artist-stat-l">Upvotes</div>
            </div>
          </div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.artist-card').forEach(card => {
      card.addEventListener('click', () => showArtistLiveries(card.dataset.artistId, card.dataset.artistName));
    });
  }

  async function showArtistLiveries(artistId, artistName) {
    document.getElementById('artists-grid').style.display = 'none';
    const section = document.getElementById('artist-liveries-section');
    section.style.display = 'block';
    document.getElementById('artist-liveries-title').textContent = `${artistName}'s liveries`;

    const liveries = await fetchLiveries({ artistId, sort: 'votes' });
    allLiveries = liveries;
    maxVotes = liveries.length ? Math.max(...liveries.map(l => l.upvotes), 1) : 1;

    // Reset tous les filtres
    ['artist-search','artist-cat','artist-champ','artist-mod','artist-pricing'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.value = el.tagName==='INPUT' ? '' : 'all';
    });
    document.getElementById('artist-sort').value = 'votes';

    const g = document.getElementById('artist-liveries-grid');
    if (!liveries.length) {
      g.innerHTML = `<div class="empty"><i class="ti ti-photo-off"></i><p>No liveries yet.</p></div>`;
      return;
    }

    // Peupler les selects depuis les livrées de cet artiste
    const cats   = [...new Map(liveries.filter(l=>l.categories).map(l=>[l.category_id,l.categories])).entries()].map(([id,cat])=>({id,...cat}));
    const champs = [...new Map(liveries.filter(l=>l.championships).map(l=>[l.championship_id,l.championships])).entries()].map(([id,ch])=>({id,...ch}));
    const mods   = [...new Map(liveries.filter(l=>l.mods).map(l=>[l.mod_id,l.mods])).entries()].map(([id,m])=>({id,...m}));

    const catSel   = document.getElementById('artist-cat');
    const champSel = document.getElementById('artist-champ');
    const modSel   = document.getElementById('artist-mod');

    catSel.innerHTML   = '<option value="all">All categories</option>'   + cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
    champSel.innerHTML = '<option value="all">All championships</option>' + champs.map(c=>`<option value="${c.id}">${c.short_name||c.name}</option>`).join('');
    modSel.innerHTML   = '<option value="all">All mods</option>'         + mods.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');

    renderArtistLiveries(liveries);

    // Cascading filters
    function updateArtistCascade(liveries) {
      const cat   = document.getElementById('artist-cat').value;
      const champ = document.getElementById('artist-champ').value;

      // Filtrer selon cat courante
      const afterCat = cat==='all' ? liveries : liveries.filter(l=>l.category_id===cat);

      // Champs disponibles pour cette cat
      const availChamps = [...new Map(afterCat.filter(l=>l.championships).map(l=>[l.championship_id,l.championships])).entries()].map(([id,ch])=>({id,...ch}));
      const prevChamp = document.getElementById('artist-champ').value;
      document.getElementById('artist-champ').innerHTML = '<option value="all">All championships</option>' + availChamps.map(ch=>`<option value="${ch.id}">${ch.short_name||ch.name}</option>`).join('');
      if(availChamps.some(ch=>ch.id===prevChamp)) document.getElementById('artist-champ').value=prevChamp;

      // Mods disponibles pour cat + champ
      const effectiveChamp = document.getElementById('artist-champ').value;
      const afterChamp = effectiveChamp==='all' ? afterCat : afterCat.filter(l=>l.championship_id===effectiveChamp);
      const availMods = [...new Map(afterChamp.filter(l=>l.mods).map(l=>[l.mod_id,l.mods])).entries()].map(([id,m])=>({id,...m}));
      const prevMod = document.getElementById('artist-mod').value;
      document.getElementById('artist-mod').innerHTML = '<option value="all">All mods</option>' + availMods.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');
      if(availMods.some(m=>m.id===prevMod)) document.getElementById('artist-mod').value=prevMod;
    }

    document.getElementById('artist-cat').addEventListener('change', ()=>{ updateArtistCascade(liveries); renderArtistLiveries(liveries); });
    document.getElementById('artist-champ').addEventListener('change', ()=>{ updateArtistCascade(liveries); renderArtistLiveries(liveries); });
    document.getElementById('artist-mod').addEventListener('change', ()=>renderArtistLiveries(liveries));
    document.getElementById('artist-search').addEventListener('input', ()=>renderArtistLiveries(liveries));
    document.getElementById('artist-pricing').addEventListener('change', ()=>renderArtistLiveries(liveries));
    document.getElementById('artist-sort').addEventListener('change', ()=>renderArtistLiveries(liveries));
  }

  function renderArtistLiveries(liveries) {
    const q       = document.getElementById('artist-search').value.toLowerCase();
    const pricing = document.getElementById('artist-pricing').value;
    const sort    = document.getElementById('artist-sort').value;

    const cat    = document.getElementById('artist-cat').value;
    const champ  = document.getElementById('artist-champ').value;
    const mod    = document.getElementById('artist-mod').value;

    let list = liveries.filter(l => {
      const mq  = !q || [l.name,l.team,l.author,l.driver,l.car_number].join(' ').toLowerCase().includes(q);
      const pq  = pricing==='all'||(pricing==='free'&&!l.is_paid)||(pricing==='paid'&&l.is_paid);
      const cq  = cat==='all'   || l.category_id===cat;
      const chq = champ==='all' || l.championship_id===champ;
      const moq = mod==='all'   || l.mod_id===mod;
      return mq && pq && cq && chq && moq;
    });
    if(sort==='votes') list.sort((a,b)=>b.upvotes-a.upvotes);
    else if(sort==='newest') list.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    else list.sort((a,b)=>a.name.localeCompare(b.name));

    const countEl = document.getElementById('results-count-artist');
    countEl.textContent = list.length ? `${list.length} liveri${list.length!==1?'es':'y'}` : '';

    const g = document.getElementById('artist-liveries-grid');
    if(!list.length){ g.innerHTML=`<div class="empty"><i class="ti ti-search"></i><p>No liveries match your filters.</p></div>`; return; }

    const seed = l => parseInt((l.id||'').replace(/\D/g,'').slice(0,6))||0;
    g.innerHTML = list.map(l => {
      const cn = l.categories?.name||''; const bg=l.categories?.color_bg||'#E6F1FB'; const tc=l.categories?.color_text||'#0C447C';
      const isNew = l.created_at && (Date.now()-new Date(l.created_at).getTime()) < 7*24*60*60*1000;
      const newDot = isNew ? '<div class="new-dot"></div>' : '';
      const paidBadge = l.is_paid
        ? `<span class="card-paid-badge" style="background:rgba(254,243,199,.9);color:#92400E"><i class="ti ti-lock" style="font-size:10px"></i> Paid</span>`
        : `<span class="card-paid-badge" style="background:rgba(209,250,229,.9);color:#065F46"><i class="ti ti-lock-open" style="font-size:10px"></i> Free</span>`;
      return `
        <div class="livery-card" onclick="location.href='livery.html?id=${l.id}'">
          <div class="card-cover">
            ${l.image_url?`<img src="${l.image_url}" alt="${l.name}" loading="lazy">`:carSVG(cn,seed(l))}
            <div class="card-cover-overlay"></div>
            ${newDot}
            <div class="card-top-badges">
              <div class="crown-badge"><i class="ti ti-crown" style="font-size:10px"></i><span class="crown-text">${l.artists?.name||''}</span></div>
              ${paidBadge}
            </div>
            <div class="card-name-overlay">
              <div class="card-name">${l.name}</div>
              <div class="card-mod">${l.mods?.name||'—'}</div>
            </div>
          </div>
          <div class="card-body">
            <div class="card-info-row">
              ${l.championships?.short_name?`<div class="card-champ"><i class="ti ti-trophy" style="font-size:10px;flex-shrink:0"></i><span>${l.championships.short_name}</span></div>`:`<div class="card-champ" style="color:var(--text3)">—</div>`}
              <span class="cat-badge" style="background:${bg};color:${tc}">${cn}</span>
            </div>
          </div>
          <div class="card-upvote-row">
            <div class="card-upvote-count">${l.upvotes.toLocaleString()} upvote${l.upvotes!==1?'s':''}</div>
            <button class="upvote-btn${voted.has(l.id)?' voted':''}" onclick="event.stopPropagation();handleVote('${l.id}',this)">
              <i class="ti ti-thumb-up" style="font-size:12px"></i> ${voted.has(l.id)?'Upvoted':'Upvote'}
            </button>
          </div>
        </div>`;
    }).join('');
  }

  async function handleVote(id, btn) {
    const isVoted = voted.has(id);
    const liv = allLiveries.find(l => l.id === id);
    if (isVoted) {
      const ok = await removeUpvoteLivery(id);
      if (ok && liv) { liv.upvotes = Math.max(0, liv.upvotes-1); voted = getVotedSet(); refreshVoteBtn(btn, liv.upvotes, false); }
    } else {
      const ok = await upvoteLivery(id);
      if (ok && liv) { liv.upvotes++; voted = getVotedSet(); refreshVoteBtn(btn, liv.upvotes, true); }
    }
  }
  function refreshVoteBtn(btn, count, isVoted) {
    btn.className = 'upvote-btn' + (isVoted ? ' voted' : '');
    btn.querySelector('span').textContent = count;
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('artist-liveries-section').style.display = 'none';
    document.getElementById('artists-grid').style.display = 'grid';
  });

  init();

  // Si ?id= dans l'URL, ouvrir directement cet artiste
  const urlParams = new URLSearchParams(location.search);
  const artistIdParam = urlParams.get('id');
  if(artistIdParam){
    // Attendre que la grille soit chargée puis cliquer
    const waitAndOpen = setInterval(()=>{
      const card = document.querySelector(`.artist-card[data-artist-id="${artistIdParam}"]`);
      if(card){ clearInterval(waitAndOpen); card.click(); }
    }, 100);
    setTimeout(()=>clearInterval(waitAndOpen), 3000);
  }
</script>
</body>
</html>
