<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livery — AC Liveries DB</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo__ac">AC</span>
    <span class="nav-logo__name">&nbsp;Liveries</span>
    <span class="nav-logo__db">DB</span>
  </a>
  <div class="nav-divider"></div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Liveries</a>
    <a href="mods.html" class="nav-link">Mods</a>
    <a href="artists.html" class="nav-link">Artists</a>
    <a href="addons.html" class="nav-link">Addons</a>
    <a href="about.html" class="nav-link">About</a>
  </div>
  <div class="nav-end">
    <button class="btn btn--icon btn--ghost" id="themeToggle" aria-label="Toggle theme">
      <i class="ti ti-sun" id="themeIcon"></i>
    </button>
    <a href="submit.html" class="btn btn--primary"><i class="ti ti-plus"></i> Submit</a>
  </div>
</nav>

<div class="page" style="padding-top:20px; padding-bottom:60px;">

  <div class="breadcrumb">
    <a href="index.html" class="breadcrumb__item" style="display:flex;align-items:center;gap:5px;">
      <i class="ti ti-arrow-left" style="font-size:13px;"></i> Back to gallery
    </a>
  </div>

  <div id="content" style="margin-top:20px;">
    <div style="display:grid;grid-template-columns:1fr 320px;gap:24px;">
      <div class="skeleton" style="min-height:300px;border-radius:14px;"></div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="skeleton" style="height:220px;border-radius:14px;"></div>
        <div class="skeleton" style="height:80px;border-radius:14px;"></div>
      </div>
    </div>
  </div>

  <div id="similar" style="margin-top:48px;"></div>
</div>

<script src="supabase.js"></script>
<script>
  const root = document.documentElement;
  const saved = localStorage.getItem('acliveries_theme') || 'dark';
  root.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next); localStorage.setItem('acliveries_theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  });

  const CAT_COLORS = { Formula:['#E82020','#003087','#006400','#FF8000'], GT:['#C8A800','#E82020','#003087'], Hillclimb:['#E87000','#E82020','#1D9E75'], Touring:['#534AB7','#E82020','#185FA5'] };
  const CAT_BG = { Formula:'#0d0d1f', GT:'#0d1a0d', Hillclimb:'#1a0d00', Touring:'#1a001a' };

  function carSVGLarge(cat, seed) {
    const p = CAT_COLORS[cat]||CAT_COLORS.Formula; const col=p[seed%p.length]; const num=(seed*7+1)%99+1; const bg=CAT_BG[cat]||'#111';
    return `<svg viewBox="0 0 500 260" width="100%" style="display:block">
      <rect width="500" height="260" fill="${bg}"/>
      <ellipse cx="250" cy="180" rx="160" ry="25" fill="#000" opacity=".4"/>
      <path d="M90 162 Q112 115 150 105 L190 90 Q250 75 310 90 L350 105 Q388 115 410 162Z" fill="${col}"/>
      <path d="M150 105 L160 80 Q250 60 340 80 L350 105Z" fill="${col}" opacity=".75"/>
      <rect x="188" y="76" width="124" height="22" rx="4" fill="#88ccff" opacity=".5"/>
      <circle cx="150" cy="166" r="26" fill="#1a1a1a"/><circle cx="150" cy="166" r="14" fill="#2a2a2a"/>
      <circle cx="350" cy="166" r="26" fill="#1a1a1a"/><circle cx="350" cy="166" r="14" fill="#2a2a2a"/>
      <text x="250" y="138" text-anchor="middle" fill="white" font-size="22" font-family="sans-serif" font-weight="bold">${num}</text>
    </svg>`;
  }

  async function init() {
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    if (!id) { location.href='index.html'; return; }

    const l = await fetchLivery(id);
    if (!l) {
      document.getElementById('content').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-2);"><i class="ti ti-alert-circle" style="font-size:32px;display:block;margin-bottom:12px;color:var(--text-3);"></i><p>Livery not found.</p></div>';
      return;
    }

    document.title = `${l.name} — AC Liveries DB`;
    const voted = getVotedSet();
    const seed = parseInt((l.id||'').replace(/\D/g,'').slice(0,6))||42;
    const catName = l.categories?.name || '';

    const rows = [
      ['ti-car',      'Mod',          l.mods?.name || '—'],
      ['ti-category', 'Category',     l.categories ? `<span class="badge" style="background:${l.categories.color_bg};color:${l.categories.color_text};">${l.categories.name}</span>` : '—'],
      ['ti-trophy',   'Championship', l.championships?.name || '—'],
      ['ti-flag',     'Team',         l.team   || '—'],
      ['ti-users',    'Drivers',      l.driver || '—'],
      ['ti-calendar', 'Season',       l.season || '—'],
      ...(l.car_number ? [['ti-hash', 'Car number', `#${l.car_number}`]] : []),
    ].map(([ico,k,v]) => `
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);">
        <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap;flex-shrink:0;">
          <i class="ti ${ico}" style="font-size:13px;"></i>${k}
        </div>
        <div style="font-size:13px;font-weight:500;color:var(--text);text-align:right;">${v}</div>
      </div>`).join('');

    const priceBadge = l.is_paid
      ? '<span class="badge badge--paid" style="padding:3px 10px;font-size:11px;">Paid livery</span>'
      : '<span class="badge badge--free" style="padding:3px 10px;font-size:11px;">Free livery</span>';

    const creatorBlock = l.artists
      ? `<a href="artists.html?id=${l.artists.id}" style="display:flex;align-items:center;gap:12px;background:var(--bg-s1);border:1px solid rgba(245,158,11,0.2);border-radius:var(--radius-lg);padding:14px 16px;text-decoration:none;transition:border-color .15s;margin-top:12px;" onmouseover="this.style.borderColor='rgba(245,158,11,0.4)'" onmouseout="this.style.borderColor='rgba(245,158,11,0.2)'">
        ${l.artists.avatar_url
          ? `<img src="${l.artists.avatar_url}" alt="${l.artists.name}" style="width:40px;height:40px;border-radius:11px;object-fit:cover;border:2px solid rgba(245,158,11,0.3);">`
          : `<div style="width:40px;height:40px;border-radius:11px;background:var(--acc-2);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--acc);border:2px solid rgba(245,158,11,0.3);">👑</div>`}
        <div style="flex:1;">
          <div style="font-size:10px;color:var(--crown);font-weight:700;letter-spacing:0.3px;text-transform:uppercase;margin-bottom:2px;">Confirmed Artist</div>
          <div style="font-size:14px;font-weight:700;color:var(--text);letter-spacing:-0.3px;">${l.artists.name}</div>
        </div>
        <i class="ti ti-chevron-right" style="color:var(--text-3);font-size:14px;"></i>
      </a>`
      : `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);"><i class="ti ti-pencil" style="font-size:13px;"></i>Creator</div>
          <div style="font-size:13px;font-weight:500;color:var(--text);">${l.author || '—'}</div>
        </div>`;

    document.getElementById('content').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;">

        <!-- Cover -->
        <div style="border-radius:16px;overflow:hidden;background:var(--bg-s2);">
          ${l.image_url
            ? `<img src="${l.image_url}" alt="${l.name}" style="width:100%;display:block;">`
            : carSVGLarge(catName, seed)}
        </div>

        <!-- Side -->
        <div style="display:flex;flex-direction:column;gap:12px;">

          <!-- Info card -->
          <div class="card" style="padding:18px;">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
              <div>
                <div style="font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:-1px;color:var(--text);line-height:1.1;">${l.name}</div>
                <div style="font-size:13px;color:var(--text-2);margin-top:4px;">${l.mods?.name || '—'}</div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                ${priceBadge}
                <button onclick="copyPageLink()" id="copyLinkBtn" class="btn btn--ghost btn--sm" style="border-radius:20px;">
                  <i class="ti ti-link"></i> Copy link
                </button>
              </div>
            </div>
            <div style="border-top:1px solid var(--border);padding-top:10px;">
              ${rows}
              ${l.notes ? `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);"><div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);flex-shrink:0;"><i class="ti ti-notes" style="font-size:13px;"></i>Notes</div><div style="font-size:12px;color:var(--text-2);text-align:right;line-height:1.5;">${l.notes}</div></div>` : ''}
            </div>
          </div>

          <!-- Artist -->
          ${creatorBlock}

          <!-- Download -->
          ${l.download_url ? `<a href="${l.download_url}" target="_blank" class="btn btn--primary btn--lg" style="width:100%;justify-content:center;text-decoration:none;border-radius:var(--radius-md);"><i class="ti ti-download"></i> Download livery</a>` : ''}

          <!-- Upvote -->
          <button class="upvote-btn${voted.has(l.id)?' voted':''}" id="upvoteBtn" style="width:100%;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600;font-family:var(--font-body);cursor:pointer;transition:all .15s;">
            <i class="ti ti-thumb-up" style="font-size:20px;"></i>
            <span id="upvoteCount">${l.upvotes}</span> upvotes
            <span id="upvoteHint" style="font-size:12px;font-weight:400;opacity:.6;">${voted.has(l.id)?'(click to remove)':'(click to upvote)'}</span>
          </button>

        </div>
      </div>`;

    document.getElementById('upvoteBtn').addEventListener('click', async () => {
      const isVoted = getVotedSet().has(l.id);
      if (isVoted) {
        const ok = await removeUpvoteLivery(l.id);
        if (ok) { l.upvotes=Math.max(0,l.upvotes-1); document.getElementById('upvoteCount').textContent=l.upvotes; document.getElementById('upvoteBtn').classList.remove('voted'); document.getElementById('upvoteHint').textContent='(click to upvote)'; }
      } else {
        const ok = await upvoteLivery(l.id);
        if (ok) { l.upvotes++; document.getElementById('upvoteCount').textContent=l.upvotes; document.getElementById('upvoteBtn').classList.add('voted'); document.getElementById('upvoteHint').textContent='(click to remove)'; }
      }
    });

    // Similar liveries
    const all = await fetchLiveries({ categoryId: l.category_id, sort:'votes' });
    const similar = all.filter(x => x.id !== l.id).slice(0,4);
    if (similar.length) {
      const seed2 = s => parseInt((s.id||'').replace(/\D/g,'').slice(0,6))||0;
      document.getElementById('similar').innerHTML = `
        <div class="section-label">Similar liveries</div>
        <div class="livery-grid">
          ${similar.map(s => {
            const cn = s.categories?.name||'';
            const isNew = s.created_at && (Date.now()-new Date(s.created_at).getTime()) < 7*24*60*60*1000;
            return `<div class="livery-card" onclick="location.href='livery.html?id=${s.id}'">
              <div class="livery-card__thumb">
                ${s.image_url?`<img src="${s.image_url}" alt="${s.name}" loading="lazy">`:carSVGLarge(cn,seed2(s)).replace('viewBox="0 0 500 260"','viewBox="0 0 500 260" height="100"')}
                <div class="livery-card__thumb-overlay"></div>
                <div class="livery-card__badges">
                  ${isNew?'<span class="badge badge--new">New</span>':''}
                  ${s.is_paid?'<span class="badge badge--paid">Paid</span>':'<span class="badge badge--free">Free</span>'}
                </div>
                ${s.artists?'<span class="livery-card__crown">👑</span>':''}
                <div class="livery-card__votes"><i class="ti ti-heart" style="font-size:11px;"></i>${s.upvotes}</div>
              </div>
              <div class="livery-card__body">
                <div class="livery-card__series">${s.championships?.short_name || cn || '—'}</div>
                <div class="livery-card__name">${s.name}</div>
                <div class="livery-card__mod">${s.mods?.name||'—'}</div>
              </div>
            </div>`;
          }).join('')}
        </div>`;
    }
  }

  function copyPageLink() {
    navigator.clipboard.writeText(location.href).then(() => {
      const btn = document.getElementById('copyLinkBtn');
      btn.innerHTML = '<i class="ti ti-check" style="color:var(--green);"></i> Copied!';
      btn.style.borderColor = 'rgba(34,197,94,0.4)';
      btn.style.color = 'var(--green)';
      setTimeout(() => {
        btn.innerHTML = '<i class="ti ti-link"></i> Copy link';
        btn.style.borderColor = '';
        btn.style.color = '';
      }, 1800);
    });
  }

  init();
</script>
</body>
</html>
