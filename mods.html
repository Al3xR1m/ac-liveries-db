<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mods — AC Liveries DB</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AC Liveries DB">
  <meta property="og:title" content="Mods — AC Liveries DB">
  <meta property="og:description" content="Browse liveries by mod on Assetto Corsa.">
  <meta property="og:url" content="https://al3xr1m.github.io/ac-liveries-db/mods.html">
  <meta property="og:image" content="https://al3xr1m.github.io/ac-liveries-db/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo__ac">AC</span>
    <span class="nav-logo__name">&nbsp;Liveries</span>
    <span class="nav-logo__db">DB</span>
  </a>
  <div class="nav-divider"></div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Liveries</a>
    <a href="mods.html" class="nav-link active" aria-current="page">Mods</a>
    <a href="artists.html" class="nav-link">Artists</a>
    <a href="addons.html" class="nav-link">Addons</a>
    <a href="about.html" class="nav-link">About</a>
  </div>
  <div class="nav-end">
    <button class="btn btn--icon btn--ghost" id="themeToggle" aria-label="Toggle theme">
      <i class="ti ti-sun" id="themeIcon"></i>
    </button>
    <a href="submit.html" class="btn btn--primary"><i class="ti ti-plus"></i> Submit</a>
  </div>
</nav>

<div class="page" style="padding-top:40px; padding-bottom:60px;">

  <div style="margin-bottom:32px;">
    <div class="hero__eyebrow" style="display:inline-flex;">
      <i class="ti ti-package"></i> Supported mods
    </div>
    <h1 class="display-md" style="margin-top:12px;">
      Supported <span style="color:var(--acc);">mods</span>
    </h1>
    <p style="font-size:13px; color:var(--text-2); margin-top:8px;">
      Browse liveries by mod — click to explore the full library.
    </p>
  </div>

  <div id="mods-root">
    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px;">
      <div class="skeleton" style="height:180px; border-radius:14px;"></div>
      <div class="skeleton" style="height:180px; border-radius:14px;"></div>
      <div class="skeleton" style="height:180px; border-radius:14px;"></div>
      <div class="skeleton" style="height:180px; border-radius:14px;"></div>
    </div>
  </div>

</div>

<script src="supabase.js"></script>
<script>
  const root = document.documentElement;
  const saved = localStorage.getItem('acliveries_theme') || 'dark';
  root.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next); localStorage.setItem('acliveries_theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  });

  // Brand colors
  const BRAND_COLORS = {
    RSS: { color:'var(--rss)', bg:'var(--rss-2)', border:'var(--rss-border)', label:'Race Sim Studio' },
    VRC: { color:'var(--vrc)', bg:'var(--vrc-2)', border:'var(--vrc-border)', label:'Virtual Racing Cars' },
    URD: { color:'var(--urd)', bg:'var(--urd-2)', border:'var(--urd-border)', label:'URD Mods' },
  };

  function catIcon(name) {
    const n = (name||'').toLowerCase();
    if(n.includes('formula')) return 'ti-steering-wheel';
    if(n.includes('gt'))      return 'ti-car';
    if(n.includes('hill'))    return 'ti-mountain';
    if(n.includes('tour'))    return 'ti-car-suv';
    return 'ti-car';
  }

  async function init() {
    const [mods, cats, liveries] = await Promise.all([fetchMods(), fetchCategories(), fetchLiveries({ sort:'votes' })]);
    if (!mods.length) {
      document.getElementById('mods-root').innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-2);"><i class="ti ti-car-off" style="font-size:32px;display:block;margin-bottom:12px;color:var(--text-3);"></i><p>No mods yet. Add some from the <a href="admin.html" style="color:var(--acc);">admin panel</a>.</p></div>`;
      return;
    }

    const liveryCount = {};
    liveries.forEach(l => { liveryCount[l.mod_id] = (liveryCount[l.mod_id]||0)+1; });

    const grouped = {};
    cats.forEach(c => { grouped[c.id] = { cat:c, mods:[] }; });
    mods.forEach(m => {
      const key = m.category_id || '__none__';
      if (!grouped[key]) grouped[key] = { cat:{ name:'Other', color_bg:'#eee', color_text:'#555' }, mods:[] };
      grouped[key].mods.push(m);
    });

    Object.values(grouped).forEach(group => {
      group.mods.sort((a,b) => (liveryCount[b.id]||0) - (liveryCount[a.id]||0));
    });

    const sortedGroups = Object.values(grouped)
      .filter(g => g.mods.length > 0)
      .sort((a,b) => {
        const totalA = a.mods.reduce((s,m) => s+(liveryCount[m.id]||0), 0);
        const totalB = b.mods.reduce((s,m) => s+(liveryCount[m.id]||0), 0);
        return totalB - totalA;
      });

    const container = document.getElementById('mods-root');
    container.innerHTML = '';

    sortedGroups.forEach(group => {
      if (!group.mods.length) return;
      const totalLiveries = group.mods.reduce((s,m) => s+(liveryCount[m.id]||0), 0);

      const section = document.createElement('div');
      section.style.marginBottom = '36px';

      // Section header
      section.innerHTML = `
        <div class="section-label" style="padding:0 0 16px;">
          <span style="display:inline-flex;align-items:center;gap:6px;">
            <span style="width:8px;height:8px;border-radius:50%;background:${group.cat.color_text};display:inline-block;"></span>
            ${group.cat.name}
          </span>
          <span style="font-weight:400;color:var(--text-3);font-size:11px;margin-left:4px;">
            ${group.mods.length} mod${group.mods.length>1?'s':''} · ${totalLiveries} liveri${totalLiveries!==1?'es':'y'}
          </span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;">
          ${group.mods.map(m => {
            const count = liveryCount[m.id]||0;
            const brand = m.brand ? (BRAND_COLORS[m.brand] || BRAND_COLORS.RSS) : null;
            return `
              <div class="card card--interactive mod-card${brand?' mod-card--'+m.brand.toLowerCase():''}" onclick="location.href='mod.html?id=${m.id}'" style="${brand?'border-color:'+brand.border+';':''} overflow:hidden; cursor:pointer;">
                <div style="width:100%;height:100px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;background:var(--bg-s2);">
                  ${m.image_url
                    ? `<img src="${m.image_url}" alt="${m.name}" style="width:100%;height:100%;object-fit:cover;">`
                    : `<i class="ti ${catIcon(group.cat.name)}" style="font-size:36px;color:var(--text-3);"></i>`}
                  ${brand ? `<span class="badge badge--${m.brand.toLowerCase()}" style="position:absolute;top:8px;left:8px;font-size:9px;padding:2px 7px;">${m.brand}</span>` : ''}
                </div>
                <div style="padding:13px 14px 14px;">
                  ${brand ? `<div style="font-size:10px;font-weight:700;color:${brand.color};letter-spacing:0.3px;text-transform:uppercase;margin-bottom:4px;">${brand.label}</div>` : ''}
                  <div style="font-size:15px;font-weight:800;letter-spacing:-0.6px;color:var(--text);margin-bottom:4px;">${m.name}</div>
                  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
                    <span class="badge" style="background:${group.cat.color_bg};color:${group.cat.color_text};">${group.cat.name}</span>
                    <span style="font-size:12px;color:var(--text-2);">${count} liveri${count!==1?'es':'y'}</span>
                  </div>
                </div>
              </div>`;
          }).join('')}
        </div>`;

      container.appendChild(section);
    });
  }

  init();
</script>
</body>
</html>
