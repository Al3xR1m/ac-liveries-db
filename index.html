<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AC Liveries DB — Community livery database for RSS mods</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <!-- Open Graph / Discord -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AC Liveries DB">
  <meta property="og:title" content="AC Liveries DB — Community livery database for RSS mods">
  <meta property="og:description" content="Browse, discover and submit liveries for Race Sim Studio mods on Assetto Corsa. Free community database.">
  <meta property="og:url" content="https://al3xr1m.github.io/ac-liveries-db/index.html">
  <meta property="og:image" content="https://al3xr1m.github.io/ac-liveries-db/og-cover.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="AC Liveries DB — Community livery database for RSS mods">
  <meta name="twitter:description" content="Browse, discover and submit liveries for Race Sim Studio mods on Assetto Corsa. Free community database.">
  <meta name="twitter:image" content="https://al3xr1m.github.io/ac-liveries-db/og-cover.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <span class="logo-icon"><i class="ti ti-flag-3"></i></span>
    <span class="logo-text">AC Liveries<span class="logo-dot">.</span>DB</span>
  </a>
  <div class="nav-links">
    <a href="index.html" class="active">Gallery</a>
    <a href="mods.html">Mods</a>
    <a href="artists.html">Artists</a>
    <a href="submit.html">Submit</a>
    <a href="about.html">About</a>
  </div>
  <div class="nav-divider"></div>
  <div class="nav-right">
    <button class="theme-toggle" id="themeToggle"><i class="ti ti-sun" id="themeIcon"></i></button>
    <a href="submit.html" class="nav-submit"><i class="ti ti-plus" style="font-size:13px"></i> Submit a livery</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Livery Gallery</h1>
    <p class="page-sub">Community-built liveries for all Race Sim Studio mods on Assetto Corsa</p>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-n" id="s-total">—</div><div class="stat-l">Liveries</div></div>
    <div class="stat-card"><div class="stat-n" id="s-mods">—</div><div class="stat-l">RSS Mods</div></div>
    <div class="stat-card"><div class="stat-n" id="s-votes">—</div><div class="stat-l">Total upvotes</div></div>
    <div class="stat-card"><div class="stat-n" id="s-top">—</div><div class="stat-l">Most popular</div></div>
  </div>

  <!-- cat-pills hidden, kept for JS compat -->
  <div id="cat-pills" style="display:none"><button class="pill active" data-cat-id="all">All</button></div>

  <!-- Search bar + Sort + Filters toggle -->
  <div class="toolbar" style="margin-bottom:8px">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input type="text" class="search-input" id="search" placeholder="Search livery, driver, team, car number…">
    </div>
    <select class="sort-select" id="sort" style="min-width:150px">
      <option value="votes">Most popular</option>
      <option value="newest">Newest first</option>
      <option value="name">A → Z</option>
    </select>
    <button class="filters-btn" id="filters-toggle-btn" onclick="toggleFilters()" style="background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600">
      <i class="ti ti-adjustments-horizontal" style="font-size:15px"></i>
      Filters
      <span class="filter-badge" id="filter-badge" style="display:none;background:#fff;color:var(--accent)">0</span>
    </button>
  </div>

  <!-- Filters panel (hidden by default) -->
  <div class="filters-panel" id="filters-panel">
    <div class="filter-group">
      <label>Category</label>
      <select class="sort-select" id="cat-select">
        <option value="all">All categories</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Championship</label>
      <select class="sort-select" id="champ-select">
        <option value="all">All championships</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Pricing</label>
      <select class="sort-select" id="pricing-select">
        <option value="all">All pricing</option>
        <option value="free">Free only</option>
        <option value="paid">Paid only</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Creator</label>
      <select class="sort-select" id="artist-select">
        <option value="all">All creators</option>
        <option value="confirmed">👑 Confirmed artists</option>
        <option value="community">Community</option>
      </select>
    </div>
    <div style="display:flex;align-items:flex-end;margin-left:auto">
      <button onclick="resetFilters()" style="font-size:12px;padding:7px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text2);cursor:pointer">Reset filters</button>
    </div>
  </div>

  <!-- New liveries banner -->
  <div id="new-banner" style="display:none;align-items:center;gap:10px;background:var(--green-bg);border:1px solid var(--green);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--green)">
    <div style="width:9px;height:9px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 0 3px var(--green-bg)"></div>
    <span id="new-banner-text"></span>
    <button onclick="showNewOnly()" style="margin-left:4px;font-size:12px;font-weight:600;padding:3px 10px;border:1px solid var(--green);border-radius:20px;background:transparent;color:var(--green);cursor:pointer">Show</button>
    <button onclick="dismissBanner()" style="margin-left:auto;background:none;border:none;color:var(--green);cursor:pointer;font-size:16px;line-height:1">×</button>
  </div>
  <!-- Results count -->
  <div id="results-count" style="font-size:12px;color:var(--text3);margin-bottom:10px;display:none"></div>

  <div class="gallery" id="gallery">
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
    <div class="skeleton" style="height:200px;border-radius:10px"></div>
  </div>
  <!-- Pagination -->
  <div id="pagination" style="display:flex;align-items:center;justify-content:center;gap:10px;padding:28px 0 40px;flex-wrap:wrap"></div>
</div>

<!-- Report modal -->
<div id="report-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;max-width:360px;width:90%">
    <div style="font-family:var(--font-display);font-size:18px;font-weight:700;margin-bottom:8px;color:var(--text)"><i class="ti ti-flag" style="color:var(--accent)"></i> Report a problem</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px">What's wrong with this livery?</div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px" id="report-reasons">
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--text2)"><input type="radio" name="report-reason" value="broken_link" checked> Broken download link</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--text2)"><input type="radio" name="report-reason" value="wrong_info"> Wrong information</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--text2)"><input type="radio" name="report-reason" value="duplicate"> Duplicate entry</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:var(--text2)"><input type="radio" name="report-reason" value="other"> Other</label>
    </div>
    <div style="margin-bottom:14px">
      <label style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text2);display:block;margin-bottom:5px">Additional context <span style="font-weight:400;color:var(--text3)">(optional)</span></label>
      <textarea id="report-notes" placeholder="Describe the issue in more detail…" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:12px;outline:none;resize:vertical;min-height:64px;box-sizing:border-box" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'"></textarea>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button id="report-cancel" style="font-size:13px;padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text2);cursor:pointer">Cancel</button>
      <button id="report-submit" style="font-size:13px;padding:6px 14px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;cursor:pointer;font-weight:500">Send report</button>
    </div>
  </div>
</div>

<script src="supabase.js"></script>
<script>
  // Theme
  const root = document.documentElement;
  const saved = localStorage.getItem('acliveries_theme') || 'dark';
  root.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').className = saved === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next); localStorage.setItem('acliveries_theme', next);
    document.getElementById('themeIcon').className = next === 'dark' ? 'ti ti-sun' : 'ti ti-moon';
  });

  // Car SVG
  const CAT_COLORS = { Formula:['#E82020','#003087','#006400','#FF8000'], GT:['#C8A800','#E82020','#003087'], Hillclimb:['#E87000','#E82020','#1D9E75'], Touring:['#534AB7','#E82020','#185FA5'] };
  const CAT_BG = { Formula:'#0d0d1f', GT:'#0d1a0d', Hillclimb:'#1a0d00', Touring:'#1a001a' };
  function carSVG(cat, seed) {
    const p = CAT_COLORS[cat]||CAT_COLORS.Formula; const col=p[seed%p.length]; const num=(seed*7+1)%99+1; const bg=CAT_BG[cat]||'#111';
    if(cat==='Hillclimb') return `<svg viewBox="0 0 200 100" width="200" height="100"><rect width="200" height="100" fill="${bg}"/><ellipse cx="100" cy="72" rx="42" ry="7" fill="#000" opacity=".4"/><path d="M68 66 Q73 52 83 48 L100 43 L117 48 Q127 52 132 66Z" fill="${col}"/><path d="M83 48 L85 37 Q100 33 115 37 L117 48Z" fill="${col}" opacity=".75"/><rect x="90" y="35" width="20" height="9" rx="2" fill="#88ccff" opacity=".5"/><circle cx="76" cy="68" r="8" fill="#1a1a1a"/><circle cx="76" cy="68" r="4" fill="#333"/><circle cx="124" cy="68" r="8" fill="#1a1a1a"/><circle cx="124" cy="68" r="4" fill="#333"/><text x="100" y="61" text-anchor="middle" fill="white" font-size="7" font-family="sans-serif" font-weight="bold">${num}</text></svg>`;
    return `<svg viewBox="0 0 200 100" width="200" height="100"><rect width="200" height="100" fill="${bg}"/><ellipse cx="100" cy="68" rx="65" ry="10" fill="#000" opacity=".4"/><path d="M36 62 Q45 46 60 42 L76 36 Q100 30 124 36 L140 42 Q155 46 164 62Z" fill="${col}"/><path d="M60 42 L64 32 Q100 24 136 32 L140 42Z" fill="${col}" opacity=".75"/><rect x="76" y="30" width="48" height="9" rx="2" fill="#88ccff" opacity=".5"/><circle cx="60" cy="64" r="10" fill="#1a1a1a"/><circle cx="60" cy="64" r="5.5" fill="#333"/><circle cx="140" cy="64" r="10" fill="#1a1a1a"/><circle cx="140" cy="64" r="5.5" fill="#333"/><text x="100" y="54" text-anchor="middle" fill="white" font-size="8" font-family="sans-serif" font-weight="bold">${num}</text></svg>`;
  }

  // State
  let activeCatId='all', activeChampId='all', activePricing=null, activeArtist='all';
  let currentPageData=[], totalCount=0;
  const PAGE_SIZE = 24;
  let currentPage = 1;
  let isLoading = false;
  let voted=getVotedSet();
  let pendingReportId=null;
  let _renderDebounce=null;

  // Pricing filter
  document.getElementById('pricing-select').addEventListener('change', function() {
    if(this.value==='free') activePricing=false;
    else if(this.value==='paid') activePricing=true;
    else activePricing=null;
    resetAndRender();
  });
  document.getElementById('artist-select').addEventListener('change', function() {
    activeArtist = this.value;
    resetAndRender();
  });

  // Report modal
  document.getElementById('report-cancel').addEventListener('click', () => { document.getElementById('report-modal').style.display='none'; document.getElementById('report-notes').value=''; });
  document.getElementById('report-submit').addEventListener('click', async () => {
    if (!pendingReportId) return;
    const reason = document.querySelector('input[name="report-reason"]:checked')?.value || 'broken_link';
    const notes  = document.getElementById('report-notes').value.trim() || null;
    await reportLivery(pendingReportId, reason, notes);
    document.getElementById('report-modal').style.display='none';
    document.getElementById('report-notes').value = '';
    pendingReportId=null;
    alert('Report sent. Thank you!');
  });

  // Filters
  let _allChamps = [];

  function updateChampSelect(catId) {
    const sel = document.getElementById('champ-select');
    const prev = sel.value;
    const filtered = catId === 'all'
      ? _allChamps
      : _allChamps.filter(ch => ch.linked_categories?.some(lc => lc.id === catId));
    sel.innerHTML = '<option value="all">All championships</option>'
      + filtered.map(ch => `<option value="${ch.id}">${ch.short_name||ch.name}</option>`).join('');
    if ([...sel.options].some(o => o.value === prev)) sel.value = prev;
    else { sel.value = 'all'; activeChampId = 'all'; }
  }

  async function buildFilters() {
    const [cats, champs] = await Promise.all([fetchCategories(), fetchChampionships()]);
    _allChamps = champs;

    // Category dropdown
    const catSel = document.getElementById('cat-select');
    catSel.innerHTML = '<option value="all">All categories</option>'
      + cats.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
    catSel.addEventListener('change', function() {
      activeCatId = this.value;
      activeChampId = 'all';
      updateChampSelect(this.value);
      resetAndRender();
    });

    // Championship dropdown
    updateChampSelect('all');
    document.getElementById('champ-select').addEventListener('change', function() {
      activeChampId = this.value;
      resetAndRender();
    });
  }

  async function render() {
    if(isLoading) return;
    isLoading = true;
    const search = document.getElementById('search').value.trim();
    const sort   = document.getElementById('sort').value;
    const g      = document.getElementById('gallery');
    const countEl= document.getElementById('results-count');

    // Paramètres Supabase
    const params = {
      categoryId:     activeCatId!=='all' ? activeCatId : undefined,
      championshipId: activeChampId!=='all' ? activeChampId : undefined,
      isPaid:         activePricing,
      confirmedOnly:  activeArtist==='confirmed',
      communityOnly:  activeArtist==='community',
      search:         search||undefined,
      sort,
      page:           currentPage,
      pageSize:       PAGE_SIZE,
    };

    // Fetch en parallèle : page courante + count total
    const [list, total] = await Promise.all([
      fetchLiveries(params),
      fetchLiveriesCount({
        categoryId:     params.categoryId,
        championshipId: params.championshipId,
        isPaid:         params.isPaid,
        confirmedOnly:  params.confirmedOnly,
        communityOnly:  params.communityOnly,
        search:         params.search,
      }),
    ]);

    currentPageData = list;
    totalCount = total;
    voted = getVotedSet();
    isLoading = false;

    if(!list.length){
      const hasFilters = activeCatId!=='all'||activeChampId!=='all'||activePricing!==null||activeArtist!=='all'||search;
      g.innerHTML=`<div class="empty"><i class="ti ti-search"></i><p>No liveries match your filters.${hasFilters?` <button onclick="resetFilters()" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:14px;text-decoration:underline">Reset filters</button>`:''}</p></div>`;
      document.getElementById('pagination').innerHTML='';
      countEl.style.display='none';
      return;
    }

    // Results count
    const showing = Math.min(currentPage*PAGE_SIZE, total);
    countEl.style.display='block';
    countEl.textContent=`Showing ${(currentPage-1)*PAGE_SIZE+1}–${showing} of ${total} liveri${total!==1?'es':'y'}`;

    // Pagination
    const totalPages = Math.ceil(total / PAGE_SIZE);
    renderPagination(total, totalPages);

    const seed=l=>parseInt((l.id||'').replace(/\D/g,'').slice(0,6))||0;
    g.innerHTML=list.map(l=>{
      const cn=l.categories?.name||'';
      const bg=l.categories?.color_bg||'#E6F1FB';
      const tc=l.categories?.color_text||'#0C447C';
      const isVoted=voted.has(l.id);
      const isArtist=!!l.artists;
      const isNew = l.created_at && (Date.now()-new Date(l.created_at).getTime()) < 7*24*60*60*1000;
      const newDot = isNew ? '<div class="new-dot"></div>' : '';
      const crownBadge=isArtist?`<div class="crown-badge"><i class="ti ti-crown" style="font-size:10px"></i><span class="crown-text">${l.artists.name}</span></div>`:'';
      const paidBadge=l.is_paid
        ?`<span class="card-paid-badge" style="background:rgba(254,243,199,.9);color:#92400E"><i class="ti ti-lock" style="font-size:10px"></i> Paid</span>`
        :`<span class="card-paid-badge" style="background:rgba(209,250,229,.9);color:#065F46"><i class="ti ti-lock-open" style="font-size:10px"></i> Free</span>`;
      const champLine=l.championships?.short_name
        ?`<div class="card-champ"><i class="ti ti-trophy" style="font-size:10px;flex-shrink:0"></i><span>${l.championships.short_name}</span></div>`
        :`<div class="card-champ" style="color:var(--text3)">—</div>`;

      return `
        <div class="livery-card" data-id="${l.id}">
          <div class="card-cover">
            ${l.image_url?`<img src="${l.image_url}" alt="${l.name}" loading="lazy">`:carSVG(cn,seed(l))}
            <div class="card-cover-overlay"></div>
            ${newDot}
            <div class="card-top-badges">${crownBadge}${paidBadge}</div>
            <div class="card-name-overlay">
              <div class="card-name">${l.name}</div>
              <div class="card-mod">${l.mods?.name||'—'}</div>
            </div>
          </div>
          <div class="card-actions">
            <button class="card-action-btn" onclick="event.stopPropagation();copyLiveryLink('${l.id}')" title="Copy link"><i class="ti ti-link" style="font-size:12px"></i></button>
            <button class="card-action-btn" onclick="event.stopPropagation();openReport('${l.id}')" title="Report a problem"><i class="ti ti-flag" style="font-size:12px"></i></button>
          </div>
          <div class="card-body">
            <div class="card-info-row">
              ${champLine}
              <span class="cat-badge" style="background:${bg};color:${tc}">${cn}</span>
            </div>
          </div>
          <div class="card-upvote-row">
            <div class="card-upvote-count">
${l.upvotes.toLocaleString()} upvote${l.upvotes!==1?'s':''}
            </div>
            <button class="upvote-btn${isVoted?' voted':''}" data-vote="${l.id}" onclick="event.stopPropagation()">
              <i class="ti ti-thumb-up" style="font-size:12px"></i>
              ${isVoted?'Upvoted':'Upvote'}
            </button>
          </div>
        </div>`;
    }).join('');

    g.querySelectorAll('.livery-card').forEach(card=>{card.addEventListener('click',()=>location.href=`livery.html?id=${card.dataset.id}`);});
    g.querySelectorAll('[data-vote]').forEach(btn=>{
      btn.addEventListener('click',async e=>{
        e.stopPropagation(); const id=btn.dataset.vote; const isVoted=voted.has(id);
        const liv=currentPageData.find(l=>l.id===id);
        if(isVoted){const ok=await removeUpvoteLivery(id);if(ok&&liv){liv.upvotes=Math.max(0,liv.upvotes-1);voted=getVotedSet();render();}}
        else{const ok=await upvoteLivery(id);if(ok&&liv){liv.upvotes++;voted=getVotedSet();render();}}
      });
    });
  }

  function renderPagination(total, totalPages) {
    const pg = document.getElementById('pagination');
    if(totalPages <= 1){ pg.innerHTML=''; return; }
    let html = '';
    // Prev
    html += `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''} style="padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:${currentPage===1?'var(--text3)':'var(--text2)'};cursor:${currentPage===1?'default':'pointer'};font-size:13px"><i class="ti ti-chevron-left"></i></button>`;
    // Pages
    for(let i=1;i<=totalPages;i++){
      if(i===1||i===totalPages||Math.abs(i-currentPage)<=1){
        html += `<button onclick="goPage(${i})" style="padding:6px 12px;border:1px solid ${i===currentPage?'var(--accent)':'var(--border)'};border-radius:var(--radius-sm);background:${i===currentPage?'var(--accent)':'var(--surface)'};color:${i===currentPage?'#fff':'var(--text2)'};cursor:pointer;font-size:13px;min-width:36px">${i}</button>`;
      } else if(Math.abs(i-currentPage)===2){
        html += `<span style="color:var(--text3);font-size:13px">…</span>`;
      }
    }
    // Next
    html += `<button onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''} style="padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:${currentPage===totalPages?'var(--text3)':'var(--text2)'};cursor:${currentPage===totalPages?'default':'pointer'};font-size:13px"><i class="ti ti-chevron-right"></i></button>`;
    // Count
    html += `<span style="font-size:12px;color:var(--text3);margin-left:6px">${total} result${total!==1?'s':''}</span>`;
    pg.innerHTML = html;
  }

  function goPage(n) {
    currentPage = n;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function copyLiveryLink(id) {
    const url = `${location.origin}${location.pathname.replace('index.html','')}livery.html?id=${id}`;
    navigator.clipboard.writeText(url).then(() => {
      // Feedback visuel sur le bouton
      const btn = document.querySelector(`.card-action-btn[onclick*="copyLiveryLink('${id}')"]`);
      if(btn){ btn.innerHTML='<i class="ti ti-check" style="font-size:12px;color:var(--green)"></i>'; setTimeout(()=>btn.innerHTML='<i class="ti ti-link" style="font-size:12px"></i>',1500); }
    });
  }

  function openReport(id) { pendingReportId=id; document.getElementById('report-modal').style.display='flex'; }

  async function init() {
    await buildFilters();
    const stats = await fetchStats();
    document.getElementById('s-total').textContent=stats.total;
    document.getElementById('s-mods').textContent=stats.mods;
    document.getElementById('s-votes').textContent=stats.votes;
    document.getElementById('s-top').textContent=stats.top;
    // Check new liveries via Supabase count
    const lastVisit = parseInt(localStorage.getItem('acliveries_last_visit')||'0');
    if(lastVisit){
      const newCount = await fetchNewLiveriesCount(lastVisit);
      if(newCount > 0){
        document.getElementById('new-banner-text').textContent = `${newCount} new liver${newCount!==1?'ies':'y'} since your last visit`;
        document.getElementById('new-banner').style.display='flex';
      }
    }
    localStorage.setItem('acliveries_last_visit', Date.now().toString());
    const params=new URLSearchParams(location.search);
    const modIdParam=params.get('mod_id');
    if(modIdParam) document.getElementById('search').value=modIdParam;
    render();
  }

  function toggleFilters(){
    const panel = document.getElementById('filters-panel');
    panel.classList.toggle('open');
  }

  function updateFilterBadge(){
    const count = [
      activeCatId!=='all',
      activeChampId!=='all',
      activePricing!==null,
      activeArtist!=='all',
    ].filter(Boolean).length;
    const badge = document.getElementById('filter-badge');
    const btn   = document.getElementById('filters-toggle-btn');
    badge.style.display = count>0 ? 'inline-flex' : 'none';
    badge.textContent   = count;
    btn.classList.toggle('has-filters', count>0);
  }

  function resetAndRender(){ currentPage=1; updateFilterBadge(); render(); }
  function resetAndRenderDebounced(){
    clearTimeout(_renderDebounce);
    _renderDebounce = setTimeout(()=>{ currentPage=1; render(); }, 300);
  }

  function resetFilters(){
    activeCatId='all'; activeChampId='all'; activePricing=null; activeArtist='all';
    document.getElementById('cat-select').value='all';
    document.getElementById('champ-select').value='all';
    document.getElementById('pricing-select').value='all';
    document.getElementById('artist-select').value='all';
    document.getElementById('search').value='';
    updateChampSelect('all');
    updateFilterBadge();
    resetAndRender();
  }

  function showNewOnly(){
    // Filtre sur les 7 derniers jours via le sort "newest" + dismiss banner
    document.getElementById('sort').value='newest';
    dismissBanner();
    resetAndRender();
    // Scroll to first new card
    setTimeout(()=>document.querySelector('.new-dot')?.closest('.livery-card')?.scrollIntoView({behavior:'smooth',block:'center'}),200);
  }

  function dismissBanner(){
    document.getElementById('new-banner').style.display='none';
    localStorage.setItem('acliveries_last_visit', Date.now().toString());
  }


  document.getElementById('search').addEventListener('input',resetAndRenderDebounced);
  document.getElementById('sort').addEventListener('change',resetAndRender);
  // Reset selects visuellement au chargement (le browser peut garder les valeurs précédentes)
  document.getElementById('cat-select').value = 'all';
  document.getElementById('champ-select').value = 'all';
  document.getElementById('pricing-select').value = 'all';
  document.getElementById('artist-select').value = 'all';
  document.getElementById('sort').value = 'votes';
  init();
</script>
</body>
</html>
